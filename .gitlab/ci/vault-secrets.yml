# Ingest + app secrets from Vault (see docs/VAULT.md).

.ingest_vault:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ${VAULT_ADDR}
  secrets:
    OPENAI_API_KEY:
      vault: ${VAULT_OPENAI_API_KEY_PATH}
      file: false
    R2_ACCESS_KEY_ID:
      vault: ${VAULT_R2_ACCESS_KEY_ID_PATH}
      file: false
    R2_SECRET_ACCESS_KEY:
      vault: ${VAULT_R2_SECRET_ACCESS_KEY_PATH}
      file: false
