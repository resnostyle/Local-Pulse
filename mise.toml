[tools]
python = "3.11"

[env]
_.file = ".env"

[tasks.setup]
description = "Copy example configs if missing, install Python deps"
run = """
if [ ! -f .env ]; then cp .env.example .env && echo "Created .env from .env.example"; fi
if [ ! -f python/config/calendars.yaml ] && [ -f python/config/calendars.yaml.example ]; then cp python/config/calendars.yaml.example python/config/calendars.yaml && echo "Created calendars.yaml from example"; fi
if [ ! -f python/config/espn.yaml ] && [ -f python/config/espn.yaml.example ]; then cp python/config/espn.yaml.example python/config/espn.yaml && echo "Created espn.yaml from example"; fi
cd python && pip install -r requirements.txt
"""

[tasks.ingest]
description = "Run one ingest pass locally (writes to LOCALPULSE_DATA_ROOT)"
run = "cd python && python main.py run --force"

[tasks.ingest-docker]
description = "Run ingest via Docker Compose"
run = "docker compose run --rm ingest"

[tasks.python]
description = "Run Python ingestion (scrape due sources). Use --force to ignore intervals."
run = "cd python && python main.py run"

[tasks.python-install]
description = "Install Python dependencies"
run = "cd python && pip install -r requirements.txt"

[tasks.python-test]
description = "Run Python unit tests"
run = "cd python && python -m pytest tests/ -v"
