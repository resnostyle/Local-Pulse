# Local dev: run one ingest pass (writes to ./data)
services:
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file: .env
    environment:
      LOCALPULSE_DATA_ROOT: /data
    volumes:
      - ./data:/data
      - ./python/config/calendars.yaml:/app/config/calendars.yaml:ro
    command: python main.py run --force
